<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>寄給妳的書 · 小小書庫</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font:20px/1.65 Georgia,'Noto Serif TC','Microsoft JhengHei',serif}main{max-width:900px;margin:auto;padding:38px 24px 60px}header{border-top:6px solid;padding-top:24px;margin-bottom:30px}.eyebrow{font:13px/1.4 Arial,sans-serif;letter-spacing:3px}h1{font-size:clamp(34px,7vw,58px);line-height:1.3;letter-spacing:2px;margin:18px 0 12px}header p{margin:0;color:#444;font-size:18px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 16px}input,select,button,a.download{font:inherit;color:inherit;background:white;border:2px solid #222;border-radius:3px;min-height:52px;padding:10px 15px}input{flex:1;min-width:160px;width:100%}button,select,a{touch-action:manipulation}button,a.download{cursor:pointer}button:disabled{color:#666;border-color:#999;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid;outline-offset:4px}#status{font-size:16px;margin:8px 0 24px;min-height:28px}#status.error{border:2px solid;padding:16px}.bar{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:2px solid;padding-bottom:12px;font-size:16px}.bar select{min-height:44px;padding:5px;font-size:16px}article{display:flex;gap:20px;align-items:center;padding:26px 0;border-bottom:1px solid #999}.number{font-size:16px;width:32px;align-self:flex-start;padding-top:5px}.info{flex:1;min-width:0}h2{font-size:25px;line-height:1.45;margin:0 0 9px;overflow-wrap:anywhere}.meta{font-size:16px;color:#444}.tag{display:inline-block;border:1px solid;padding:0 7px;margin-right:10px;color:#171717;font:14px/1.7 Arial,sans-serif}a.download{display:block;text-decoration:none;background:#171717;color:white;white-space:nowrap;text-align:center;font-size:18px}.original{display:block;text-align:center;font-size:14px;margin-top:8px;color:#333}#empty{padding:40px 8px;border-bottom:1px solid #999}#empty strong{display:block;font-size:24px;margin-bottom:10px}.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}.pager span{font-size:16px}footer{margin-top:45px;border-top:2px solid;padding-top:18px;font-size:15px;color:#444}details{margin-top:22px;font-size:16px}summary{cursor:pointer;padding:10px 0}details p{margin:10px 0}noscript{display:block;border:2px solid;padding:20px}body.large{font-size:23px}body.large h2{font-size:30px}[hidden]{display:none!important}@media(max-width:500px){main{padding:25px 18px 40px}article{flex-wrap:wrap;gap:12px}.number{display:none}.info{flex-basis:100%}.actions{width:100%}.original{text-align:left}.tools{gap:9px}.tools button{flex:1}h1{font-size:38px}}
</style></head><body><main><header><div class="eyebrow">A LITTLE LIBRARY, FOR YOU</div><h1>寄給妳的書</h1><p>慢慢挑一本，把喜歡的故事帶走。</p></header><noscript>請在瀏覽器啟用 JavaScript，才能讀取書單。也可直接開啟下方 Google Sheet。</noscript><div class="tools"><input id="search" type="search" aria-label="搜尋書名或作者" placeholder="搜尋書名、作者…"><button id="refresh">更新書單</button><button id="size" aria-pressed="false">放大文字</button></div><p id="status" role="status" aria-live="polite">正在讀取書單…</p><div class="bar"><span id="count">書庫</span><label>排列 <select id="sort"><option value="new">後加入在前</option><option value="old">原表順序</option><option value="name">書名</option></select></label></div><section id="books" aria-label="電子書列表"></section><div id="empty" hidden></div><nav class="pager" aria-label="分頁" hidden id="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></nav><details><summary>閱讀與下載小提示</summary><p>點「下載」會開啟檔案連結。部分服務會先顯示預覽或確認頁，請再選擇下載。網站無法確認檔案是否已儲存到裝置。</p><p>EPUB 或 PDF 是否可讀，請以妳的電紙書支援格式為準。本頁不會轉換電子書格式。</p><p>更新失敗時，可稍後重試。若顯示暫存書單，仍須連線才能下載檔案。</p><a href="https://docs.google.com/spreadsheets/d/1gWKaC0E7QhFrYwxfmwvHjjq7kN-VuHtJ7_yK_1LO0hM/edit?usp=sharing" rel="noreferrer">開啟原始書單</a></details><footer>一本書，一段留給自己的時間。<br>為電紙書而設計 · 黑白介面，沒有動畫。</footer></main>
<script>
(function(){'use strict';
// 第一個工作表，第一列為標題。A=書名 B=下載連結 C=作者（選填） D=格式（選填）。
var SHEET_ID='1gWKaC0E7QhFrYwxfmwvHjjq7kN-VuHtJ7_yK_1LO0hM';
var SHEET_NAME=''; // 若需要指定分頁，填入完整分頁名稱。
var KEY='little-library:'+SHEET_ID, books=[],page=1,busy=false,serial=0;
function $(id){return document.getElementById(id)}
function cell(row,i){return row.c&&row.c[i]&&row.c[i].v!=null?String(row.c[i].v).trim():''}
function url(value){try{var u=new URL(value);return /^https?:$/.test(u.protocol)&&!u.username&&!u.password?u.href:''}catch(e){return ''}}
function drive(value){var u=new URL(value),m;if(u.hostname==='drive.google.com'){m=u.pathname.match(/^\/file\/d\/([\w-]+)/);var id=m?m[1]:u.searchParams.get('id');if(id&&/^[\w-]+$/.test(id)){var out='https://drive.google.com/uc?export=download&id='+encodeURIComponent(id);var key=u.searchParams.get('resourcekey');if(key)out+='&resourcekey='+encodeURIComponent(key);return out}}return value}
function el(tag,text,cls){var n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function render(){var q=$('search').value.toLowerCase().trim(),list=books.filter(function(b){return(b.title+' '+b.author+' '+b.format).toLowerCase().indexOf(q)!==-1});if($('sort').value==='new')list.reverse();if($('sort').value==='name')list.sort(function(a,b){return a.title.localeCompare(b.title,'zh-Hant')});var total=Math.max(1,Math.ceil(list.length/12));page=Math.min(page,total);$('books').textContent='';$('count').textContent=q?list.length+' 本符合 · 共 '+books.length+' 本':books.length+' 本藏書';$('empty').hidden=!!list.length;if(!list.length){$('empty').textContent='';$('empty').appendChild(el('strong',q?'沒有找到這本書':'書架留了一個位置'));$('empty').appendChild(el('p',q?'試試其他書名或作者。':'目前沒有有效書目。請在 Sheet 第一列填上「書名、下載連結」，再從第二列加入書本。'))}list.slice((page-1)*12,page*12).forEach(function(b,i){var row=el('article');row.appendChild(el('div',('0'+((page-1)*12+i+1)).slice(-2),'number'));var info=el('div',null,'info');info.appendChild(el('h2',b.title));var meta=el('div',null,'meta');meta.appendChild(el('span',b.format||'電子書','tag'));if(b.author)meta.appendChild(document.createTextNode(b.author));info.appendChild(meta);row.appendChild(info);var actions=el('div',null,'actions'),a=el('a','下載 ↓','download');a.href=drive(b.link);a.rel='noreferrer';a.setAttribute('aria-label','下載 '+b.title);actions.appendChild(a);if(a.href!==b.link){var orig=el('a','原始連結','original');orig.href=b.link;orig.rel='noreferrer';actions.appendChild(orig)}row.appendChild(actions);$('books').appendChild(row)});$('pager').hidden=total<=1;$('page').textContent=page+' / '+total;$('prev').disabled=page<=1;$('next').disabled=page>=total}
function status(t,error){$('status').textContent=t;$('status').className=error?'error':''}
function load(){if(busy)return;busy=true;$('refresh').disabled=true;status('正在更新書單…');var script=document.createElement('script'),name='booksResponse'+(++serial),done=false;var timer=setTimeout(function(){finish(null)},18000);function finish(data){if(done)return;done=true;clearTimeout(timer);script.remove();window[name]=function(){};busy=false;$('refresh').disabled=false;if(!data||data.status!=='ok'||!data.table||!Array.isArray(data.table.rows)){status((books.length?'更新失敗，目前顯示上次成功讀取的暫存書單。':'無法讀取書單。')+' 請確認 Sheet 已開放「知道連結的任何人：檢視者」，以及網絡連線正常。',true);render();return}var skipped=0;books=[];data.table.rows.forEach(function(r){var title=cell(r,0),raw=cell(r,1),link=url(raw);if(!title&&!raw)return;if(!title||!link){skipped++;return}books.push({title:title,link:link,author:cell(r,2),format:cell(r,3)})});var when=new Date().toLocaleString('zh-HK');try{localStorage.setItem(KEY,JSON.stringify({books:books,time:when}))}catch(e){}page=1;status('已更新 · '+when+(skipped?' · 已略過 '+skipped+' 列缺少書名或有效網址的資料':''));render()}
window[name]=finish;script.onerror=function(){finish(null)};script.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json;responseHandler:'+name+'&headers=1&range=A:D'+(SHEET_NAME?'&sheet='+encodeURIComponent(SHEET_NAME):'')+'&_='+Date.now();document.head.appendChild(script)}
try{var cached=JSON.parse(localStorage.getItem(KEY)||'null');if(cached&&Array.isArray(cached.books)){books=cached.books.filter(function(b){return b&&typeof b.title==='string'&&url(b.link)&&typeof b.author==='string'&&typeof b.format==='string'});status('上次書單 · '+cached.time)}}catch(e){}
$('refresh').onclick=load;$('search').oninput=function(){page=1;render()};$('sort').onchange=function(){page=1;render()};$('size').onclick=function(){var on=document.body.classList.toggle('large');this.setAttribute('aria-pressed',String(on));this.textContent=on?'標準文字':'放大文字'};$('prev').onclick=function(){page--;render();window.scrollTo(0,0)};$('next').onclick=function(){page++;render();window.scrollTo(0,0)};render();load();
})();
</script></body></html>
